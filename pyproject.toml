[tool.poetry]
name = "chat2query-python-sdk"
version = "0.1.0"
description = "Python SDK for Chat2Query API"
authors = ["George Pamfilis <gpamfilis@gmail.com>"]
readme = "README.md"
license = "Proprietary"
packages = [{include = "chat2query"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
sphinx = "^7.4.7"
sphinx-autodoc-typehints = "^1.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
